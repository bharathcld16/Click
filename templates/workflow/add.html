<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Application</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0a0a0a; color: #e0e0e0; min-height: 100vh; }
        header {
            background: rgba(10,10,10,0.97); border-bottom: 1px solid #1e1e1e;
            padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center;
        }
        header h1 { color: #7c3aed; font-size: 1.2rem; }
        header a { color: #aaa; text-decoration: none; font-size: 0.88rem; }
        header a:hover { color: #7c3aed; }

        .container { max-width: 600px; margin: 3rem auto; padding: 0 2rem; }
        h2 { margin-bottom: 2rem; font-size: 1.5rem; }
        h2 span { color: #7c3aed; }

        .form-group { margin-bottom: 1.2rem; }
        label { display: block; font-size: 0.85rem; color: #888; margin-bottom: 0.4rem; }
        input, textarea {
            width: 100%; background: #111; border: 1px solid #222; border-radius: 8px;
            padding: 0.7rem 1rem; color: #e0e0e0; font-size: 0.9rem; outline: none;
            transition: border-color 0.2s;
        }
        input:focus, textarea:focus { border-color: #7c3aed; }
        textarea { resize: vertical; min-height: 100px; }

        .actions { display: flex; gap: 1rem; margin-top: 1.5rem; }
        .btn {
            padding: 0.7rem 1.5rem; border-radius: 8px; font-size: 0.9rem;
            font-weight: 600; cursor: pointer; border: none; text-decoration: none;
            display: inline-block; transition: background 0.2s;
        }
        .btn-primary { background: #7c3aed; color: white; }
        .btn-primary:hover { background: #6d28d9; }
        .btn-secondary { background: #1a1a1a; color: #aaa; border: 1px solid #333; }
        .btn-secondary:hover { border-color: #7c3aed; color: #7c3aed; }
    </style>
</head>
<body>
<header>
    <h1>📋 CV / Job Tracker</h1>
    <a href="{% url 'workflow_home' %}">← Back to Dashboard</a>
</header>
<div class="container">
    <h2>Add <span>New Application</span></h2>
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label>Company *</label>
            <input type="text" name="company" placeholder="e.g. Amazon" required>
        </div>
        <div class="form-group">
            <label>Role *</label>
            <input type="text" name="role" placeholder="e.g. Backend Engineer" required>
        </div>
        <div class="form-group">
            <label>Location</label>
            <input type="text" name="location" placeholder="e.g. Remote, New York">
        </div>
        <div class="form-group">
            <label>Job URL</label>
            <input type="url" name="url" placeholder="https://...">
        </div>
        <div class="form-group">
            <label>Notes</label>
            <textarea name="notes" placeholder="Any notes about this application..."></textarea>
        </div>
        <div class="actions">
            <button type="submit" class="btn btn-primary">Save Application</button>
            <a href="{% url 'workflow_home' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
